<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<script>/* 新しい版が公開されていたら、古いページのまま使わないよう一度だけ読み直す（js/version.js・version.json） */
(function () { var B = '__BUILD__'; if (B.indexOf('__') === 0 || !window.fetch) return;
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.build || j.build === B) return;
    var k = 'ar-reload-' + j.build; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
    var u = new URL(location.href); u.searchParams.set('v', j.build); location.replace(u.href);
  }).catch(function () {}); })();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>展示用シート｜AR</title>
<link rel="stylesheet" href="../css/style.css?v=__BUILD__">
<style id="page-size">@page { size: A4 landscape; margin: 0; }</style>
</head>
<body class="sheet-page">
<div class="sheet-toolbar no-print">
  <a href="./">← 管理用</a>
  <label>公開先のURL <input id="base-url" type="url"></label>
  <label>用紙 <select id="paper"><option value="A4">A4 横</option><option value="A3">A3 横</option></select></label>
  <button class="btn btn-primary small-btn" id="btn-print" type="button">印刷</button>
  <p class="muted small">図面は台帳の画像をそのまま、縮小・切り取りなしで刷ります（図面の周りの文字やQRは認識に影響しません）。光沢のない紙を使ってください。</p>
</div>
<div id="sheets"></div>
<script src="../lib/qrcode.js?v=__BUILD__"></script>
<script type="module" src="sheet.js?v=__BUILD__"></script>
</body>
</html>
