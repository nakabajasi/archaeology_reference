<script>/* 新しい版が公開されていたら、古いページのまま使わないよう一度だけ読み直す（js/version.js・version.json） */
(function () { var B = '__BUILD__'; if (B.indexOf('__') === 0 || !window.fetch) return;
  fetch('../version.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) {
    if (!j.build || j.build === B) return;
    var k = 'ar-reload-' + j.build; try { if (sessionStorage.getItem(k)) return; sessionStorage.setItem(k, '1'); } catch (e) { return; }
    var u = new URL(location.href); u.searchParams.set('v', j.build); location.replace(u.href);
  }).catch(function () {}); })();</script>

  </header>
