<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>図面にかざす｜Archaeology Reference</title>
<link rel="stylesheet" href="css/style.css?v=__BUILD__">

<body class="stage-page">
<div id="stage"></div>

<div class="topbar" id="topbar" hidden>
  <a class="pill" href="index.html">← 一覧</a>
  <div class="group">
    <button class="pill" id="btn-see" type="button" aria-pressed="false">透かす</button>
    <button class="pill" id="btn-mode" type="button" aria-pressed="false">形だけ</button>
    <button class="pill" id="btn-notes" type="button" aria-pressed="false" hidden>注記</button>
  </div>
</div>
<p class="warn-bar" id="warn" role="status" hidden></p>
<p class="hint" id="hint" hidden></p>
<p class="config-warn" id="config-warn" hidden></p>
<div class="recover" id="recover" hidden><button class="pill" id="btn-rescan" type="button">探し直す</button></div>
<div id="panel" hidden></div>

<div class="gate" id="gate">
  <div class="gate-inner">
    <h1>図面にかざす</h1>
    <p>カメラと、スマホの動きのセンサーを使います（許可を求められたら「許可」を選んでください）。映像はこの端末の中だけで処理し、送信も保存もしません。</p>
    <div class="callout" id="inapp" hidden>このアプリ内の画面ではカメラが動かないことがあります。メニューから「Safariで開く」または「ブラウザで開く」を選んでください。</div>
    <button class="btn btn-primary" id="btn-start" type="button">カメラを起動</button>
    <a class="btn" id="link-viewer" href="viewer.html">カメラなしで3Dを見る</a>
    <p class="error" id="gate-error" hidden></p>
  </div>
</div>
